<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory console</title>
<link rel="stylesheet" href="/console/style.css">
</head>
<body>
<header>
  <h1>Memory console</h1>
  <nav>
    <button data-tab="overview" class="active">Overview <kbd>1</kbd></button>
    <button data-tab="graph">Graph <kbd>2</kbd></button>
    <button data-tab="search">Search <kbd>3</kbd></button>
    <button data-tab="audit">Audit <kbd>4</kbd></button>
  </nav>
  <span id="status" class="muted"></span>
</header>

<section id="login" hidden>
  <p>Paste the console token (from <code>cmh console</code>). It is kept in this tab only.</p>
  <input id="token-input" type="password" autocomplete="off" placeholder="cmh_...">
  <button id="token-save">Open</button>
</section>

<main>
  <section id="tab-overview" class="tab">
    <div id="tiles" class="tiles"></div>
    <div class="cols">
      <div><h2>Projects</h2><table id="projects"></table></div>
      <div><h2>Daemon</h2><table id="daemon"></table>
           <h2>Devices</h2><table id="devices"></table></div>
    </div>
  </section>

  <section id="tab-graph" class="tab" hidden>
    <div class="toolbar">
      <button id="g-projects">Project projection</button>
      <input id="g-entity" placeholder="entity, e.g. context_memory.memory.service" size="40">
      <select id="g-depth"><option value="1">depth 1</option><option value="2">depth 2</option></select>
      <button id="g-go">Show neighbourhood</button>
      <span id="g-info" class="muted"></span>
    </div>
    <div id="legend" class="legend"></div>
    <div id="cy"></div>
  </section>

  <section id="tab-search" class="tab" hidden>
    <div class="toolbar">
      <input id="q" placeholder="search memory" size="60">
      <select id="mode"><option value="">default</option><option>vector</option><option>hybrid</option><option>bm25</option></select>
      <button id="q-go">Search</button>
      <span id="q-info" class="muted"></span>
    </div>
    <div id="results"></div>
  </section>

  <section id="tab-audit" class="tab" hidden>
    <p id="chain" class="muted"></p>
    <table id="audit"></table>
  </section>
</main>
<script src="/console/vendor/cytoscape.min.js"></script>
<script src="/console/app.js"></script>
</body>
</html>
